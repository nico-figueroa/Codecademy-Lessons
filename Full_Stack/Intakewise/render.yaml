services:
  - type: web
    name: drug-intake-api
    runtime: node
    plan: free
    rootDir: Full_Stack/Intakewise/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      # Supabase session-pooler URI (IPv4-compatible). Entered in the Render dashboard on first Blueprint sync.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # Supabase root CA certificate (PEM) from Project Settings > Database > SSL Configuration.
      - key: DATABASE_SSL_CA
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        fromService:
          name: drug-intake-web
          type: web
          property: host

  - type: web
    name: drug-intake-web
    runtime: static
    rootDir: Full_Stack/Intakewise/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://drug-intake-api.onrender.com/api
