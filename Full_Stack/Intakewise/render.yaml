services:
  - type: web
    name: intakewise-api
    runtime: node
    plan: free
    rootDir: Full_Stack/Intakewise/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      # Render has no outbound IPv6, so the IPv6-only direct host (db.<ref>.supabase.co) is unreachable.
      # Use the free Supabase session pooler (IPv4), entered in the Render dashboard on first Blueprint sync:
      # postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # Supabase root CA certificate (PEM) from Project Settings > Database > SSL Configuration.
      - key: DATABASE_SSL_CA
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        fromService:
          name: intakewise
          type: web
          property: host

  - type: web
    name: intakewise
    runtime: static
    rootDir: Full_Stack/Intakewise/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://intakewise-api.onrender.com/api
