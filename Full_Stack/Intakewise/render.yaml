databases:
  - name: drug-intake-db
    plan: basic-256mb
    databaseName: drug_intake_organizer
    user: drug_intake_user

services:
  - type: web
    name: drug-intake-api
    runtime: node
    rootDir: Full_Stack/Intakewise/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: drug-intake-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_SSL
        value: "false"
      - key: CLIENT_ORIGIN
        fromService:
          name: drug-intake-web
          type: web
          property: host

  - type: web
    name: drug-intake-web
    runtime: static
    rootDir: Full_Stack/Intakewise/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://drug-intake-api.onrender.com/api
