<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Quote</title>
  <link href="https://fonts.googleapis.com/css?family=Nunito+Sans:400,400i,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <h1>Update a Quote</h1>
  <nav>
    <a href="index.html">API Home</a>
    <a href="quotes.html">Quotes</a>
    <a href="add-quote.html">Add a New Quote</a>
    <a href="update-quote.html">Update a Quote</a>
    <a href="delete-quote.html">Delete a Quote</a>
  </nav>
  <div class="inputs">
    <label for="index">Quote ID:</label>
    <input id="index" value="" type="number" min="0">
    <label for="quote">Quote text:</label>
    <input id="quote" value="">
    <label for="person">Person:</label>
    <input id="person" value="">
    <label for="year">Year:</label>
    <input id="year" value="" type="number" min="1" max="2026">
  </div>
  <div>
    <button id="update-quote" type="button">Update Quote</button>
  </div>
  <div id="updated-quote">
    
  </div>
  <script src="update-quote.js"></script>
</body>
</html>
